[project]
name = "chemvision-tuned"
version = "0.1.0"
description = "Tuned small VLM for molecule image -> SMILES, benchmarked on Fireworks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rdkit>=2024.9",
    "pillow>=10",
    "openai>=1.50",
    "fireworks-ai>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "gradio>=5.0",
    "modal>=1.6.3",
    "tokenizers>=0.23.3",
]

[tool.uv]
dev-dependencies = ["pytest>=8"]
